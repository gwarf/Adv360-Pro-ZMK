on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    outputs:
      version: ${{ steps.get_info.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            label="${{ github.ref_name }}"
            # get_version.sh silently drops any other character, which would break the release/Mod+V match
            if ! echo "$label" | grep -qE '^[A-Za-z0-9.]+$'; then
              echo "Release tag '$label' may only contain letters, digits and dots" >&2
              exit 1
            fi
            date=$(git -c safe.directory='*' log -1 --format=%cd --date=format:%Y%m%d)
            file_prefix=adv360-$label
          else
            label=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
            date=$(date -u +"%Y%m%d")
            file_prefix=$(date +"%Y%m%d%H%M")-$commit
          fi
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          # Mod+V sends unshifted keycodes, so the keyboard types this string in lowercase
          echo "version=$(echo "$date-$label-$commit" | tr '[A-Z]' '[a-z]')" >> $GITHUB_OUTPUT
          bin/get_version.sh "$label" "$commit" "$date"
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --verify-tag \
            --title "$VERSION" --generate-notes \
            --notes "Mod+V on this firmware types \`$VERSION\`." \
            adv360-*-left.uf2 adv360-*-right.uf2
